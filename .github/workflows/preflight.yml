name: Preflight

on:
  workflow_call:
    inputs:
      version:
        description: 'Optional release version to assert, with or without v prefix (e.g., v1.0.0)'
        required: false
        type: string
        default: ''
      publishFlavor:
        description: 'Build, sign and publish the JeanZ flavor instead of discarding the compiled binary'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The asset name is constant so that the "latest release" download URL never
  # changes, even though every release has its own tag.
  DMG_NAME: JeanZ_macos_arm64.dmg
  UPDATER_NAME: JeanZ_macos_arm64.app.tar.gz

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    permissions:
      # Needed by the "Publish rolling release" step. GitHub does not allow
      # expressions here, so it is granted unconditionally; the step itself only
      # runs when publishFlavor is set.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Scoped down to the only platform this fork ships. Restore an entry to
        # bring a platform back; every step below is still platform-aware.
        #   - platform: 'ubuntu-22.04'
        #     preflightArgs: ''
        #   - platform: 'ubuntu-22.04-arm'
        #     preflightArgs: ''
        #   - platform: 'windows-latest'
        #     preflightArgs: ''
        include:
          - platform: 'macos-latest'
            preflightArgs: '--target aarch64-apple-darwin'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Assert release version
        if: inputs.version != ''
        run: node scripts/assert-release-version.js "${{ inputs.version }}"

      # A JeanZ release is the upstream product version plus this fork's own
      # patch suffix: 0.1.73-z1, 0.1.73-z2, 0.2.0-z3. The counter is read from
      # the existing tags and never restarts, so a higher -z is always newer.
      # It is resolved before the build because the version is compiled into
      # the bundle.
      - name: Resolve the JeanZ version
        id: version
        if: ${{ inputs.publishFlavor && matrix.platform == 'macos-latest' }}
        # An explicit bash sets pipefail, which the default shell does not, so a
        # failing resolver fails the step instead of being swallowed by tee.
        shell: bash
        run: node scripts/jeanz-version.mjs | tee -a "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: preflight-${{ matrix.platform }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Tauri build script requires bundle.resources path `../dist` to exist
      # (see tauri.conf.json). Keep this even if dist/.gitkeep is missing.
      # Use bash so Windows runners don't use PowerShell mkdir (fails if dist exists).
      - name: Ensure dist exists for Tauri resources
        shell: bash
        run: mkdir -p dist && touch dist/.gitkeep

      - name: Rust clippy
        run: bun run rust:clippy

      - name: Frontend tests
        run: bun run test:run

      - name: Release version tests
        run: bun run test:jeanz-version

      - name: Rust tests
        run: bun run rust:test

      - name: Build Tauri app without bundling
        if: ${{ !inputs.publishFlavor }}
        run: bun run tauri build ${{ matrix.preflightArgs }} --no-bundle --ci

      # Fork flavor. This is the same compile as the step above, so the two are
      # mutually exclusive: the binary is bundled, signed and published instead
      # of being thrown away. See docs/developer/fork-macos-builds.md.
      - name: Build JeanZ bundle
        if: ${{ inputs.publishFlavor && matrix.platform == 'macos-latest' }}
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPDATER_KEY: ${{ secrets.JEANZ_UPDATER_PRIVATE_KEY }}
          UPDATER_KEY_PASSWORD: ${{ secrets.JEANZ_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          # A missing secret arrives as an empty string, and Tauri reads
          # APPLE_SIGNING_IDENTITY with var_os. An empty value would therefore
          # be used as the identity and break codesign, so only a complete set
          # is exported. Everything else falls back to the ad-hoc identity in
          # the overlay. Four characters is below every real value.
          complete() { [ "${#1}" -ge 4 ]; }

          if complete "$IDENTITY" && complete "$CERT"; then
            # Overrides the coolLabs identity pinned in tauri.conf.json. The
            # bundler rejects APPLE_CERTIFICATE when it does not match.
            export APPLE_SIGNING_IDENTITY="$IDENTITY"
            export APPLE_CERTIFICATE="$CERT"
            export APPLE_CERTIFICATE_PASSWORD="$CERT_PASSWORD"
            echo "Signing with the Developer ID certificate"

            if complete "$NOTARY_APPLE_ID" && complete "$NOTARY_PASSWORD" && complete "$TEAM_ID"; then
              export APPLE_ID="$NOTARY_APPLE_ID"
              export APPLE_PASSWORD="$NOTARY_PASSWORD"
              export APPLE_TEAM_ID="$TEAM_ID"
              export APPLE_PROVIDER_SHORT_NAME="$TEAM_ID"
              echo "Notarization is enabled"
            else
              echo "No notarization credentials - the build is signed but not notarized"
            fi
          else
            echo "No certificate - using the ad-hoc identity from the overlay"
          fi

          # The overlay leaves createUpdaterArtifacts off, because Tauri fails
          # the build when a pubkey is configured and the artifacts are asked
          # for without a private key - that would break every local build. It
          # is turned on here, and only when the key is actually present.
          # Both halves are required. Tauri prompts on a terminal that does not
          # exist when the password is missing, and rejects an empty one, so a
          # half-configured pair would fail the build rather than degrade.
          UPDATER_CONFIG='{}'
          if complete "$UPDATER_KEY" && complete "$UPDATER_KEY_PASSWORD"; then
            export TAURI_SIGNING_PRIVATE_KEY="$UPDATER_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$UPDATER_KEY_PASSWORD"
            UPDATER_CONFIG='{"bundle": {"createUpdaterArtifacts": true}}'
            echo "Building updater artifacts"
          else
            echo "No updater key - this build ships no in-app update"
          fi

          # Configs are merged in the order they are given and the flag also
          # accepts an inline JSON string, so the resolved version and the
          # updater switch are layered on top of the flavor overlay without
          # editing a file. https://v2.tauri.app/reference/cli/#build
          bun run tauri build --ci ${{ matrix.preflightArgs }} \
            --bundles app,dmg \
            -c src-tauri/tauri.fork.conf.json \
            -c "{\"version\": \"${{ steps.version.outputs.version }}\"}" \
            -c "$UPDATER_CONFIG"

      - name: Collect the DMG
        id: dmg
        if: ${{ inputs.publishFlavor && matrix.platform == 'macos-latest' }}
        run: |
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle"
          DMG=$(find "$BUNDLE_DIR/dmg" -name '*.dmg' -print -quit)
          if [ -z "$DMG" ]; then
            echo "No DMG was produced"
            exit 1
          fi
          mv "$DMG" "$DMG_NAME"
          APP="$BUNDLE_DIR/macos/JeanZ.app"
          codesign -dv --verbose=4 "$APP" 2>&1 | sed -n 's/^Authority=/authority: /p' || true
          # `spctl -a` accepts a Developer ID build that was never notarized as
          # long as the copy is not quarantined, so it cannot be used here. A
          # stapled ticket is the only definitive test.
          if xcrun stapler validate "$APP" > /dev/null 2>&1; then
            STATUS="notarized"
          elif codesign -dv --verbose=2 "$APP" 2>&1 | grep -q 'Authority=Developer ID Application'; then
            STATUS="signed, not notarized (Gatekeeper will warn)"
          else
            STATUS="ad-hoc (Gatekeeper will warn)"
          fi
          echo "Signature status: $STATUS"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      # The in-app update check reads latest.json from the newest release,
      # downloads the .app.tar.gz named in it, verifies it against the pubkey
      # in the overlay and replaces the running bundle. Both files are written
      # here; the build step only produces them when the signing key exists, so
      # a keyless build simply publishes no update and says so.
      - name: Write latest.json
        if: ${{ inputs.publishFlavor && matrix.platform == 'macos-latest' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle"
          TARBALL="$BUNDLE_DIR/macos/JeanZ.app.tar.gz"

          if [ ! -f "$TARBALL" ]; then
            echo "No updater artifacts in this build - skipping latest.json"
            exit 0
          fi

          mv "$TARBALL" "$UPDATER_NAME"
          # node writes the JSON so that the minisign signature, which is two
          # lines of text, is escaped correctly.
          SIGNATURE_PATH="$TARBALL.sig" node -e '
            const { readFileSync, writeFileSync } = require("node:fs")
            writeFileSync(
              "latest.json",
              JSON.stringify(
                {
                  version: process.env.VERSION,
                  notes: `JeanZ ${process.env.VERSION}`,
                  pub_date: new Date().toISOString(),
                  platforms: {
                    "darwin-aarch64": {
                      signature: readFileSync(process.env.SIGNATURE_PATH, "utf8"),
                      url: `https://github.com/${process.env.REPOSITORY}/releases/download/${process.env.TAG}/${process.env.UPDATER_NAME}`,
                    },
                  },
                },
                null,
                2
              ) + "\n"
            )
          '
          cat latest.json

      - name: Upload build artifact
        if: ${{ inputs.publishFlavor && matrix.platform == 'macos-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: jeanz-macos-arm64-${{ steps.version.outputs.version }}
          path: ${{ env.DMG_NAME }}
          if-no-files-found: error
          retention-days: 14

      # A full release, not a prerelease, and its own tag per build. --latest
      # keeps the /releases/latest/download/ URL pointing at the newest build,
      # so the download link is stable although the tag changes.
      - name: Publish the release
        if: ${{ inputs.publishFlavor && matrix.platform == 'macos-latest' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          UPSTREAM: ${{ steps.version.outputs.upstream }}
          STATUS: ${{ steps.dmg.outputs.status }}
        run: |
          # latest.json has to sit in the newest release, because that is the
          # URL the installed app polls. It is absent when the build had no
          # updater key, and then the release simply carries the DMG.
          ASSETS=("$DMG_NAME")
          UPDATE="no (this build has no updater artifacts)"
          if [ -f latest.json ]; then
            ASSETS+=("$UPDATER_NAME" latest.json)
            UPDATE="yes"
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "JeanZ $VERSION" \
            --notes "Jean $UPSTREAM - commit \`${GITHUB_SHA:0:7}\` - signature: $STATUS.

          Apple Silicon only. Install by opening the DMG and dragging JeanZ to Applications. Later builds arrive through the in-app update check.

          JeanZ shares the Jean app-data directory, so projects, sessions and CLI logins carry over. Do not run both apps at the same time." \
            "${ASSETS[@]}"

          {
            echo "### JeanZ $VERSION"
            echo ""
            echo "- upstream: Jean $UPSTREAM"
            echo "- signature: $STATUS"
            echo "- in-app update: $UPDATE"
            echo "- download: https://github.com/${{ github.repository }}/releases/latest/download/$DMG_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
